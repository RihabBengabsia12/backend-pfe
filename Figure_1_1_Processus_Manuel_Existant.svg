<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1200" viewBox="0 0 2200 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#193c62" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52799d"/></marker>
    <style>
      .title{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:#183b63}.subtitle{font-family:Arial,sans-serif;font-size:22px;fill:#627d99}.section{font-family:Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:1px;fill:#385c7d}.stage{font-family:Arial,sans-serif;font-size:23px;font-weight:700;fill:#183b63}.detail{font-family:Arial,sans-serif;font-size:17px;fill:#516f8d}.tag{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#486987}.tool{font-family:Arial,sans-serif;font-size:16px;fill:#6b7890}.riskTitle{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#ad6b16}.risk{font-family:Arial,sans-serif;font-size:17px;fill:#8b6322}.caption{font-family:Arial,sans-serif;font-size:18px;fill:#627d99}
    </style>
  </defs>
  <rect width="2200" height="1200" fill="#f8fbff"/>
  <text x="1100" y="72" text-anchor="middle" class="title">Processus existant de traitement d’un dossier d’appel d’offres</text>
  <text x="1100" y="111" text-anchor="middle" class="subtitle">Processus majoritairement manuel, fondé sur des supports et sources d’information distincts</text>
  <rect x="70" y="150" width="2060" height="830" rx="28" fill="#ffffff" stroke="#c6d9ea" stroke-width="3"/>
  <text x="120" y="205" class="section">ÉTAPES OPÉRATIONNELLES</text>
  <line x1="155" y1="482" x2="2045" y2="482" stroke="#d9e5ef" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="125" y="285" width="245" height="285" rx="22" fill="#eaf5ff" stroke="#82bee9" stroke-width="3"/>
    <rect x="425" y="285" width="245" height="285" rx="22" fill="#f1effd" stroke="#b5a7ec" stroke-width="3"/>
    <rect x="725" y="285" width="245" height="285" rx="22" fill="#edf8f1" stroke="#90cba2" stroke-width="3"/>
    <rect x="1025" y="285" width="245" height="285" rx="22" fill="#fff7e8" stroke="#efbd69" stroke-width="3"/>
    <rect x="1325" y="285" width="245" height="285" rx="22" fill="#eaf5ff" stroke="#82bee9" stroke-width="3"/>
    <rect x="1625" y="285" width="245" height="285" rx="22" fill="#f1effd" stroke="#b5a7ec" stroke-width="3"/>
    <rect x="1925" y="285" width="155" height="285" rx="22" fill="#edf8f1" stroke="#90cba2" stroke-width="3"/>
  </g>
  <g stroke="#52799d" stroke-width="4" marker-end="url(#arrow)"><line x1="370" y1="430" x2="420" y2="430"/><line x1="670" y1="430" x2="720" y2="430"/><line x1="970" y1="430" x2="1020" y2="430"/><line x1="1270" y1="430" x2="1320" y2="430"/><line x1="1570" y1="430" x2="1620" y2="430"/><line x1="1870" y1="430" x2="1920" y2="430"/></g>
  <g>
    <rect x="153" y="308" width="190" height="28" rx="14" fill="#cfe9fb"/><text x="248" y="328" text-anchor="middle" class="tag">ÉQUIPE OFFRES</text><text x="248" y="378" text-anchor="middle" class="stage">1. Réception</text><text x="248" y="408" text-anchor="middle" class="stage">du dossier</text><text x="248" y="454" text-anchor="middle" class="detail">Réception, diffusion et</text><text x="248" y="478" text-anchor="middle" class="detail">classement initial du TDR</text>
    <rect x="453" y="308" width="190" height="28" rx="14" fill="#ddd7f7"/><text x="548" y="328" text-anchor="middle" class="tag">ANALYSTE</text><text x="548" y="378" text-anchor="middle" class="stage">2. Lecture et</text><text x="548" y="408" text-anchor="middle" class="stage">repérage</text><text x="548" y="454" text-anchor="middle" class="detail">Lecture manuelle des</text><text x="548" y="478" text-anchor="middle" class="detail">exigences et des délais</text>
    <rect x="753" y="308" width="190" height="28" rx="14" fill="#d6f0dc"/><text x="848" y="328" text-anchor="middle" class="tag">ANALYSTE</text><text x="848" y="378" text-anchor="middle" class="stage">3. Extraction</text><text x="848" y="408" text-anchor="middle" class="stage">des données</text><text x="848" y="454" text-anchor="middle" class="detail">Saisie et consolidation</text><text x="848" y="478" text-anchor="middle" class="detail">manuelles des informations</text>
    <rect x="1053" y="308" width="190" height="28" rx="14" fill="#fbe8c6"/><text x="1148" y="328" text-anchor="middle" class="tag">RÉFÉRENTIEL INTERNE</text><text x="1148" y="378" text-anchor="middle" class="stage">4. Recherche des</text><text x="1148" y="408" text-anchor="middle" class="stage">capacités internes</text><text x="1148" y="454" text-anchor="middle" class="detail">Recherche de références,</text><text x="1148" y="478" text-anchor="middle" class="detail">experts et expériences</text>
    <rect x="1353" y="308" width="190" height="28" rx="14" fill="#cfe9fb"/><text x="1448" y="328" text-anchor="middle" class="tag">ÉQUIPE / MANAGER</text><text x="1448" y="378" text-anchor="middle" class="stage">5. Évaluation et</text><text x="1448" y="408" text-anchor="middle" class="stage">concertation</text><text x="1448" y="454" text-anchor="middle" class="detail">Analyse de faisabilité,</text><text x="1448" y="478" text-anchor="middle" class="detail">risques et arbitrage</text>
    <rect x="1653" y="308" width="190" height="28" rx="14" fill="#ddd7f7"/><text x="1748" y="328" text-anchor="middle" class="tag">ÉQUIPE OFFRES</text><text x="1748" y="378" text-anchor="middle" class="stage">6. Préparation</text><text x="1748" y="408" text-anchor="middle" class="stage">des livrables</text><text x="1748" y="454" text-anchor="middle" class="detail">Rédaction, compilation</text><text x="1748" y="478" text-anchor="middle" class="detail">et mise en forme manuelles</text>
    <rect x="1939" y="308" width="128" height="28" rx="14" fill="#d6f0dc"/><text x="2003" y="328" text-anchor="middle" class="tag">MANAGER</text><text x="2003" y="378" text-anchor="middle" class="stage">7. Décision</text><text x="2003" y="408" text-anchor="middle" class="stage">finale</text><text x="2003" y="454" text-anchor="middle" class="detail">Validation et</text><text x="2003" y="478" text-anchor="middle" class="detail">archivage</text>
  </g>
  <text x="120" y="642" class="section">SUPPORTS MOBILISÉS, MAIS NON INTÉGRÉS</text>
  <g filter="url(#shadow)"><rect x="175" y="680" width="250" height="76" rx="16" fill="#f7faff" stroke="#c6d9ea" stroke-width="2"/><rect x="490" y="680" width="250" height="76" rx="16" fill="#f7faff" stroke="#c6d9ea" stroke-width="2"/><rect x="805" y="680" width="250" height="76" rx="16" fill="#f7faff" stroke="#c6d9ea" stroke-width="2"/><rect x="1120" y="680" width="250" height="76" rx="16" fill="#f7faff" stroke="#c6d9ea" stroke-width="2"/><rect x="1435" y="680" width="250" height="76" rx="16" fill="#f7faff" stroke="#c6d9ea" stroke-width="2"/><rect x="1750" y="680" width="250" height="76" rx="16" fill="#f7faff" stroke="#c6d9ea" stroke-width="2"/></g>
  <text x="300" y="727" text-anchor="middle" class="tool">E-mails et répertoires partagés</text><text x="615" y="727" text-anchor="middle" class="tool">TDR au format PDF ou Word</text><text x="930" y="727" text-anchor="middle" class="tool">Tableurs et documents bureautiques</text><text x="1245" y="727" text-anchor="middle" class="tool">CVthèque et archives de références</text><text x="1560" y="727" text-anchor="middle" class="tool">Échanges et réunions internes</text><text x="1875" y="727" text-anchor="middle" class="tool">GED et dossiers d’archivage</text>
  <rect x="235" y="825" width="1730" height="105" rx="20" fill="#fff9ed" stroke="#f0c572" stroke-width="3"/>
  <text x="1100" y="868" text-anchor="middle" class="riskTitle">Limites du processus existant : délais de traitement élevés, informations dispersées, risque d’omission et traçabilité limitée des décisions.</text>
  <text x="1100" y="903" text-anchor="middle" class="risk">Les solutions existantes peuvent soutenir certaines tâches, sans couvrir nécessairement l’ensemble du workflow métier.</text>
  <line x1="160" y1="1032" x2="2040" y2="1032" stroke="#d4e1ed" stroke-width="2"/>
  <text x="1100" y="1084" text-anchor="middle" class="caption">Source : élaboré par l’auteure à partir de l’analyse du processus existant de traitement des dossiers d’appels d’offres.</text>
</svg>
