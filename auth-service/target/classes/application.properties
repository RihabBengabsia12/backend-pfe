server.port=9090
spring.application.name=auth-service
# Utilisation du port et de l'utilisateur qui fonctionnent
spring.datasource.url=jdbc:postgresql://projectiq-postgres:5432/projectiq_auth_db
spring.datasource.username=postgres
spring.datasource.password=projectiq_postgres

# Force Flyway à utiliser ces mêmes identifiants pour éviter l'erreur 28P01
spring.flyway.user=postgres
spring.flyway.password=projectiq_postgres
spring.flyway.baseline-on-migrate=true

# --- JWT ---
jwt.secret=CetteCleFaitExactement64CaracteresEtElleEstTresStablePourLePFE2026
jwt.access-token-expiration-minutes=15
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Remplace localhost par le nom du service dans docker-compose
spring.rabbitmq.host=projectiq-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Connexion au serveur Discovery
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
# Optionnel : pour voir instantanément le service dans Eureka
eureka.instance.lease-renewal-interval-in-seconds=5

prefer-ip-address: true

# --- MAIL (MAILPIT - LOCAL) ---
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Désactive Flyway pour laisser Hibernate créer la table
spring.flyway.enabled=false

# Force Hibernate à recréer la structure basée sur ton entité Java
spring.jpa.hibernate.ddl-auto=update