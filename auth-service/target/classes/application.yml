server:
  port: 9090

spring:
  application:
    name: auth-service

mail:
  host: mailpit
  port: 1025
  properties:
    mail:
      smtp:
        auth: false
        starttls:
          enable: false

eureka:
  instance:
    # FORCE L'IP : Évite l'erreur UnknownHostException (DESKTOP-XXX)
    prefer-ip-address: true
    # Optionnel : définit un ID unique clair dans Eureka
    instance-id: ${spring.application.name}:${random.value}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_SERVER:localhost}:8761/eureka/
