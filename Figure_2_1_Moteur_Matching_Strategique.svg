<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Principe général d’un moteur de matching stratégique</title>
  <desc id="desc">Schéma théorique reliant les exigences extraites d’un dossier et le référentiel organisationnel à un moteur de matching, produisant des scores de couverture, une matrice d’écarts et une aide à la décision.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#183b63}.sub{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#61758a}.section{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;letter-spacing:.7px;fill:#47657f}.box-title{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#183b63}.box-text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#50657c}.small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#61758a}.arrow{stroke:#6387a9;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke:#c48a35;stroke-width:2.2;fill:none;stroke-dasharray:7 5;marker-end:url(#dash)}.border{stroke:#b9cadb;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6387a9"/></marker>
    <marker id="dash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c48a35"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16395e" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="980" class="bg"/>
  <text x="800" y="57" text-anchor="middle" class="title">Principe général d’un moteur de matching stratégique</text>
  <text x="800" y="84" text-anchor="middle" class="sub">Comparaison des exigences d’un dossier avec les capacités disponibles d’une organisation</text>

  <rect x="45" y="115" width="1510" height="770" rx="22" fill="#fff" stroke="#c9d9e8" stroke-width="2"/>

  <!-- Inputs -->
  <text x="115" y="165" class="section">SOURCES D’ENTRÉE</text>
  <g filter="url(#shadow)"><rect x="115" y="190" width="360" height="220" rx="16" fill="#eaf5fd" stroke="#90c3e9" stroke-width="2"/></g>
  <text x="295" y="230" text-anchor="middle" class="box-title">Dossier / document source</text>
  <text x="295" y="258" text-anchor="middle" class="box-text">Termes de Référence, cahier des charges,</text><text x="295" y="280" text-anchor="middle" class="box-text">appel d’offres ou demande client</text>
  <line x1="155" y1="305" x2="435" y2="305" stroke="#b9cadb"/>
  <text x="295" y="335" text-anchor="middle" class="box-title">Extraction des exigences</text>
  <text x="295" y="362" text-anchor="middle" class="box-text">NLP / LLM / règles d’extraction</text><text x="295" y="385" text-anchor="middle" class="small">Besoins, contraintes, profils et critères</text>

  <g filter="url(#shadow)"><rect x="115" y="490" width="360" height="250" rx="16" fill="#eef8f0" stroke="#91c79b" stroke-width="2"/></g>
  <text x="295" y="530" text-anchor="middle" class="box-title">Référentiel organisationnel</text>
  <text x="295" y="562" text-anchor="middle" class="box-text">Compétences et domaines d’activité</text>
  <text x="295" y="589" text-anchor="middle" class="box-text">Références et expériences comparables</text>
  <text x="295" y="616" text-anchor="middle" class="box-text">Profils experts et qualifications</text>
  <text x="295" y="643" text-anchor="middle" class="box-text">Historique de relation avec le client</text>
  <text x="295" y="690" text-anchor="middle" class="small">Données métier disponibles et validées</text>

  <!-- engine -->
  <text x="650" y="165" class="section">MOTEUR DE MATCHING</text>
  <g filter="url(#shadow)"><rect x="590" y="190" width="420" height="550" rx="18" fill="#f2effa" stroke="#b8a8dc" stroke-width="2"/></g>
  <text x="800" y="235" text-anchor="middle" class="box-title">Analyse de correspondance</text>
  <text x="800" y="263" text-anchor="middle" class="box-text">Comparaison sémantique et règles métier</text>
  <line x1="640" y1="292" x2="960" y2="292" stroke="#c8bde4"/>
  <g filter="url(#shadow)"><rect x="650" y="325" width="300" height="58" rx="11" fill="#fff" class="border"/></g>
  <text x="800" y="360" text-anchor="middle" class="box-text">Matching des compétences</text>
  <g filter="url(#shadow)"><rect x="650" y="405" width="300" height="58" rx="11" fill="#fff" class="border"/></g>
  <text x="800" y="440" text-anchor="middle" class="box-text">Matching des références similaires</text>
  <g filter="url(#shadow)"><rect x="650" y="485" width="300" height="58" rx="11" fill="#fff" class="border"/></g>
  <text x="800" y="520" text-anchor="middle" class="box-text">Matching des experts et qualifications</text>
  <g filter="url(#shadow)"><rect x="650" y="565" width="300" height="58" rx="11" fill="#fff" class="border"/></g>
  <text x="800" y="600" text-anchor="middle" class="box-text">Analyse de la relation client</text>
  <text x="800" y="675" text-anchor="middle" class="small">Détection des couvertures, écarts et besoins d’adaptation</text>

  <!-- outputs -->
  <text x="1130" y="165" class="section">RÉSULTATS</text>
  <g filter="url(#shadow)"><rect x="1130" y="190" width="345" height="145" rx="16" fill="#fff5e9" stroke="#e7ba78" stroke-width="2"/></g>
  <text x="1302" y="230" text-anchor="middle" class="box-title">Taux de couverture</text>
  <text x="1302" y="260" text-anchor="middle" class="box-text">Compétences · références · experts</text><text x="1302" y="284" text-anchor="middle" class="box-text">et niveau de relation client</text>
  <g filter="url(#shadow)"><rect x="1130" y="385" width="345" height="145" rx="16" fill="#edf6fd" stroke="#90c3e9" stroke-width="2"/></g>
  <text x="1302" y="425" text-anchor="middle" class="box-title">Matrice de différenciation</text>
  <text x="1302" y="455" text-anchor="middle" class="box-text">Couvert · partiel · non couvert</text><text x="1302" y="479" text-anchor="middle" class="box-text">ou besoin de partenariat</text>
  <g filter="url(#shadow)"><rect x="1130" y="580" width="345" height="160" rx="16" fill="#eef8f0" stroke="#91c79b" stroke-width="2"/></g>
  <text x="1302" y="620" text-anchor="middle" class="box-title">Aide à la décision</text>
  <text x="1302" y="651" text-anchor="middle" class="box-text">Forces, lacunes et actions à mener</text><text x="1302" y="676" text-anchor="middle" class="box-text">avant la soumission</text>
  <text x="1302" y="710" text-anchor="middle" class="small">Résultats à interpréter par les décideurs</text>

  <!-- arrows -->
  <path d="M475 300 L590 370" class="arrow"/><path d="M475 615 L590 555" class="arrow"/>
  <path d="M1010 465 L1130 262" class="arrow"/><path d="M1010 465 L1130 457" class="arrow"/><path d="M1010 465 L1130 660" class="dash"/>
  <text x="1045" y="372" class="small">Résultats</text>

  <!-- Human validation -->
  <g filter="url(#shadow)"><rect x="590" y="785" width="420" height="64" rx="14" fill="#fff9e7" stroke="#e6c76a" stroke-width="1.8"/></g>
  <text x="800" y="813" text-anchor="middle" class="box-title">Validation et interprétation humaines</text>
  <text x="800" y="835" text-anchor="middle" class="small">Contrôle des résultats avant toute décision opérationnelle</text>
  <path d="M1130 660 L1010 792" class="dash"/>

  <line x1="105" y1="905" x2="1495" y2="905" stroke="#d8e3ec"/>
  <text x="800" y="940" text-anchor="middle" class="sub">Source : élaboré par l’auteure à partir de la littérature sur le matching stratégique et l’aide à la décision.</text>
</svg>
