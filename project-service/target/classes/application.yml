spring:
  application:
    name: PROJECT-SERVICE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectiq_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8083

spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 100MB

# --- AJOUTS NECESSAIRES POUR TES CONFIGS JAVA ---

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

jwt:
  secret: CetteCleFaitExactement64CaracteresEtElleEstTresStablePourLePFE2026
  access-token-expiration-minutes: 60

# Configuration pour le client Feign (appel vers ia-service)
ia-service:
  url: ${IA_SERVICE_URL:http://localhost:8081}

projectiq:
  config-api-key: ${PROJECTIQ_CONFIG_API_KEY:}
  internal-api-key: ${PROJECTIQ_INTERNAL_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Configuration pour Feign (Timeout de 1h pour les gros dossiers IA)
feign:
  client:
    config:
      default:
        connectTimeout: 60000
        readTimeout: 3600000
